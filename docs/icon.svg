<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title">
    <title id="title">erupt-skill — erupting volcano mark</title>

    <!-- cream paper ground -->
    <rect width="48" height="48" fill="#FFF9EE"/>

    <!-- flying debris stickers -->
    <rect x="5.5" y="6" width="4.2" height="4.2" fill="#F7BFD2" stroke="#14120B" stroke-width="2" stroke-linejoin="round" transform="rotate(16 7.6 8.1)"/>
    <rect x="38.5" y="11" width="3.8" height="3.8" fill="#93D655" stroke="#14120B" stroke-width="2" stroke-linejoin="round" transform="rotate(-14 40.4 12.9)"/>

    <!-- eruption burst -->
    <polygon points="24,1.5 27.4,7.6 33,9.5 27.4,11.4 24,17.5 20.6,11.4 15,9.5 20.6,7.6"
             fill="#FCE566" stroke="#14120B" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- volcano -->
    <polygon points="5.5,43 16.5,19.5 31.5,19.5 42.5,43"
             fill="#4FC8EC" stroke="#14120B" stroke-width="2.8" stroke-linejoin="round"/>
</svg>
